name: Container images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - .github/workflows/container-images.yml
      - .dockerignore
      - Dockerfile
      - Package.swift
      - Sources/**
      - MCPServer/Package.swift
      - MCPServer/Package.resolved
      - MCPServer/Sources/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            image: kastan-cli
            title: Kaštan CLI image
            description: Personal IDOS searches from a containerized command line
          - target: mcp
            image: kastan-mcp
            title: Kaštan MCP image
            description: Read-only IDOS search tools over MCP stdio or Streamable HTTP

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:test
          build-args: |
            KASTAN_VERSION=test
            KASTAN_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Test image metadata
        env:
          IMAGE: ${{ matrix.image }}:test
        run: |
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE")" = test
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ .Config.User }}' "$IMAGE")" = '65532:65532'

      - name: Test CLI image
        if: matrix.target == 'cli'
        run: |
          set -o pipefail
          docker run --rm "${{ matrix.image }}:test" --language cs --help |
            grep --fixed-strings '🌰 Použití:'

      - name: Test MCP image
        if: matrix.target == 'mcp'
        run: |
          set -euo pipefail
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"container-smoke-test","version":"1.0"}}}'
          coproc server { docker run --rm --interactive "${{ matrix.image }}:test"; }
          server_pid=$server_PID
          input_fd=${server[1]}
          output_fd=${server[0]}
          printf '%s\n' "$request" >&"$input_fd"
          IFS= read -r response <&"$output_fd"
          exec {input_fd}>&-
          wait "$server_pid"
          printf '%s\n' "$response" | grep --fixed-strings 'kastan-mcp'

      - name: Test MCP HTTP image
        if: matrix.target == 'mcp'
        run: |
          set -euo pipefail
          token='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          container_id="$(docker run --rm --detach \
            --publish 127.0.0.1::8080 \
            --env KASTAN_MCP_BEARER_TOKEN="$token" \
            "${{ matrix.image }}:test" \
            --transport http --host 0.0.0.0)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$container_id" 8080/tcp | sed -n 's/.*://p' | head -n 1)"

          for _ in {1..30}; do
            if curl --fail --silent --show-error "http://127.0.0.1:$port/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent --show-error "http://127.0.0.1:$port/health" >/dev/null || {
            docker logs "$container_id"
            exit 1
          }

          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"container-http-smoke-test","version":"1.0"}}}'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$request" \
            "http://127.0.0.1:$port/mcp")" = 401
          response="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $token" \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data "$request" \
            "http://127.0.0.1:$port/mcp")"
          printf '%s\n' "$response" | grep --fixed-strings 'kastan-mcp'

      - name: Test MCP OAuth discovery image
        if: matrix.target == 'mcp'
        run: |
          set -euo pipefail
          container_id="$(docker run --rm --detach \
            --publish 127.0.0.1::8080 \
            --env KASTAN_MCP_AUTH_MODE=oauth \
            --env KASTAN_MCP_OAUTH_ISSUER=https://kastan-test.authkit.app \
            --env KASTAN_MCP_OAUTH_RESOURCE=https://mcp.example.com/mcp \
            --env KASTAN_MCP_OAUTH_REQUIRED_SCOPES=openid \
            "${{ matrix.image }}:test" \
            --transport http --host 0.0.0.0)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "$container_id" 8080/tcp | sed -n 's/.*://p' | head -n 1)"

          for _ in {1..30}; do
            if curl --fail --silent --show-error "http://127.0.0.1:$port/health" >/dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail --silent --show-error "http://127.0.0.1:$port/health" >/dev/null || {
            docker logs "$container_id"
            exit 1
          }

          metadata="$(curl --fail --silent --show-error \
            "http://127.0.0.1:$port/.well-known/oauth-protected-resource")"
          printf '%s\n' "$metadata" | grep --fixed-strings '"resource":"https:\/\/mcp.example.com\/mcp"'
          printf '%s\n' "$metadata" | grep --fixed-strings '"authorization_servers":["https:\/\/kastan-test.authkit.app"]'

          headers="$(curl --silent --dump-header - --output /dev/null \
            --header 'Content-Type: application/json' \
            --header 'Accept: application/json, text/event-stream' \
            --data '{}' \
            "http://127.0.0.1:$port/mcp")"
          printf '%s\n' "$headers" | grep --fixed-strings \
            'resource_metadata="https://mcp.example.com/.well-known/oauth-protected-resource"'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Publish multi-platform image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            KASTAN_VERSION=${{ steps.metadata.outputs.version }}
            KASTAN_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

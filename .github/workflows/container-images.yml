name: Container images

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - .github/workflows/container-images.yml
      - .dockerignore
      - Dockerfile
      - Package.swift
      - Sources/**
      - MCPServer/Package.swift
      - MCPServer/Package.resolved
      - MCPServer/Sources/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cli
            image: kastan-cli
            title: Kaštan CLI image
            description: Personal IDOS searches from a containerized command line
          - target: mcp
            image: kastan-mcp
            title: Kaštan MCP image
            description: Read-only IDOS search tools over MCP stdio

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build native test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: ${{ matrix.image }}:test
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Test CLI image
        if: matrix.target == 'cli'
        run: |
          set -o pipefail
          docker run --rm "${{ matrix.image }}:test" --language cs --help |
            grep --fixed-strings '🌰 Použití:'

      - name: Test MCP image
        if: matrix.target == 'mcp'
        run: |
          set -euo pipefail
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"container-smoke-test","version":"1.0"}}}'
          coproc server { docker run --rm --interactive "${{ matrix.image }}:test"; }
          server_pid=$server_PID
          input_fd=${server[1]}
          output_fd=${server[0]}
          printf '%s\n' "$request" >&"$input_fd"
          IFS= read -r response <&"$output_fd"
          exec {input_fd}>&-
          wait "$server_pid"
          printf '%s\n' "$response" | grep --fixed-strings 'kastan-mcp'

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Publish multi-platform image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
